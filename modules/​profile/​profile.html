<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - XriAura</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div id="app">
        <div class="glass-card profile-wrapper">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #38bdf8, #3b82f6); border-radius: 50%; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #0f172a;">XR</div>
                <h2 style="margin: 0; color: #f8fafc;">@xriyanbd</h2>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #38bdf8;">Verified User</p>
            </div>

            <div style="background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #94a3b8;">User ID:</span>
                    <span style="color: #f8fafc; font-weight: bold;">#7849201</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #94a3b8;">Status:</span>
                    <span style="color: #38bdf8; font-weight: bold;">Active</span>
                </div>
            </div>
        </div>
    </div>
