<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XriAura Mini App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Dynamic module content will load here -->
        <div id="module-container">
            <div class="loading-spinner">Loading XriAura...</div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="loadModule('home'); setActive(this);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="loadModule('task'); setActive(this);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Task</span>
        </button>
        <button class="nav-item center-earn" onclick="loadModule('earn'); setActive(this);">
            <div class="earn-glow-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <span>Earn</span>
        </button>
        <button class="nav-item" onclick="loadModule('refer'); setActive(this);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Refer</span>
        </button>
        <button class="nav-item" onclick="loadModule('profile'); setActive(this);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </button>
    </nav>

    <script src="theme.js"></script>
    <script>
        function setActive(buttonElement) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            buttonElement.classList.add('active');
        }

        async function loadModule(moduleName) {
            const container = document.getElementById('module-container');
            container.innerHTML = '<div class="loading-spinner">Loading...</div>';

            try {
                const response = await fetch(`modules/${moduleName}/${moduleName}.html`);
                if (!response.ok) throw new Error('Module file not found');
                const html = await response.text();
                container.innerHTML = html;

                try {
                    const moduleScript = await import(`./modules/${moduleName}/${moduleName}.js`);
                    if (moduleScript.init) {
                        moduleScript.init();
                    }
                } catch (jsErr) {
                    // Module without JS or loading fallback
                }
            } catch (error) {
                container.innerHTML = `<div class="glass-card"><h2>Error</h2><p>Unable to load ${moduleName} module.</p></div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadModule('home');
        });
    </script>
</body>
</html>
