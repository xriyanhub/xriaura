<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn - XriAura</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div id="app">
        <div class="glass-card" style="text-align: center;">
            <h2>💰 Tap & Earn</h2>
            <p>Tap the core to gather energy rewards!</p>

            <div style="margin: 30px 0;">
                <button id="tapBtn" style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #38bdf8, #3b82f6); border: 2px solid rgba(255, 255, 255, 0.3); font-size: 22px; font-weight: bold; color: #ffffff; cursor: pointer; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); transition: transform 0.1s ease;">
                    TAP
                </button>
            </div>

            <div style="background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 10px;">
                <p style="margin: 0; font-size: 14px; color: #94a3b8;">Earned Points</p>
                <h3 style="margin: 5px 0 0 0; font-size: 26px; color: #38bdf8;"><span id="tapScore">0</span></h3>
            </div>
        </div>
    </div>
</body>
</html>
